<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guia de Botecos</title>

  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="header-overlay">
      <h1>🍻 Guia de Botecos</h1>
      <p>Feito pra quem ama buteco de verdade ❤️</p>
    </div>
  </header>

  <main class="container">

    <div class="filtros">
      <input type="text" id="search" placeholder="Buscar bar..." />

      <select id="filtro-dia">
        <option value="">Todos os dias</option>
        <option>Segunda-feira</option>
        <option>Terça-feira</option>
        <option>Quarta-feira</option>
        <option>Quinta-feira</option>
        <option>Sexta-feira</option>
        <option>Sábado</option>
        <option>Domingo</option>
      </select>

      <select id="filtro-bairro">
        <option value="">Todos os bairros</option>
      </select>

      <select id="filtro-regiao">
        <option value="">Todas as regiões</option>
      </select>
    </div>

    <div id="lista-bares" class="grid"></div>

  </main>

  <script src="script.js"></script>
</body>
</html>
